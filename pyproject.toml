[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrag"
version = "0.1.0"
description = "Agentic multimodal RAG over PDFs"
requires-python = ">=3.11,<3.13"

[project.scripts]
mmrag = "mmrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run: unit + integration. Live tests (real OpenAI calls) only on request: -m live
addopts = "-m 'not live' -ra"
markers = [
    "unit: fast tests with no external services",
    "integration: needs the Docker PostgreSQL (docker compose up -d)",
    "live: calls the real OpenAI API (costs a fraction of a cent)",
    "regression: re-parses whole PDFs from data/pdfs and compares with approved snapshots (slow)",
]
