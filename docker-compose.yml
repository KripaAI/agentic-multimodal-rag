# Local development services (docs/05-low-level-design.md §4.2, §5.9).
# Data lives in named volumes: bind-mounting a Windows folder as the Postgres
# data directory fails on NTFS permissions.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    # Pinned to the tested build (arize-phoenix v20.16.0).
    image: arizephoenix/phoenix@sha256:d55a4ffac8c670e2d0bf72e44e81e32a73e832b7ce449e6e4567487adfa9d8d6
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "6006:6006"   # trace UI + OTLP/HTTP (/v1/traces)
      - "4317:4317"   # OTLP/gRPC
    volumes:
      - phoenix_data:/mnt/data

  ingest:
    # Runs mmrag commands in Linux: Windows Smart App Control blocks tiktoken's native library,
    # which indexing needs. Not started by `docker compose up`; use
    #   docker compose run --rm ingest ingest index "file.pdf"
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app

volumes:
  pgdata:
  phoenix_data:
