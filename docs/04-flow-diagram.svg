<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1470" viewBox="0 0 1400 1470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5563"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 700; fill: #1A1F29; }
      .b  { font-size: 12px; fill: #333B47; }
      .s  { font-size: 11.5px; fill: #5B6573; font-style: italic; }
      .sec{ font-size: 15px; font-weight: 700; fill: #1F3D6B; letter-spacing: .3px; }
      .lbl{ font-size: 11.5px; fill: #4A5563; font-weight: 600; }
      .ln { stroke: #4A5563; stroke-width: 1.6; fill: none; }
      .cpu{ fill: #E3EDFB; stroke: #2B5797; stroke-width: 1.4; }
      .gpu{ fill: #FDEBD8; stroke: #C8641A; stroke-width: 1.6; }
      .api{ fill: #E2F4E8; stroke: #2E8B57; stroke-width: 1.4; }
      .sto{ fill: #EEF0F3; stroke: #6B7280; stroke-width: 1.4; }
      .out{ fill: #F1E8FA; stroke: #7A4BB0; stroke-width: 1.4; }
      .usr{ fill: #FFFFFF; stroke: #1A1F29; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1400" height="1470" fill="#FFFFFF"/>

  <!-- Title + legend -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1F3D6B">Agentic Multimodal RAG: Application Flow</text>
  <text x="40" y="63" class="b">GPU used only for VLM captioning at ingestion · OpenAI API for reasoning at query time · PostgreSQL (pgvector + full-text) stores everything · rest runs on the laptop CPU</text>
  <rect x="40"  y="78" width="14" height="14" rx="3" class="cpu"/><text x="60"  y="90" class="b">Laptop CPU</text>
  <rect x="150" y="78" width="14" height="14" rx="3" class="gpu"/><text x="170" y="90" class="b">Temporary GPU (Kaggle / Colab)</text>
  <rect x="370" y="78" width="14" height="14" rx="3" class="api"/><text x="390" y="90" class="b">OpenAI API</text>
  <rect x="480" y="78" width="14" height="14" rx="3" class="sto"/><text x="500" y="90" class="b">Data store</text>
  <rect x="590" y="78" width="14" height="14" rx="3" class="out"/><text x="610" y="90" class="b">Answer output</text>

  <!-- ================= SECTION 1: INGESTION ================= -->
  <rect x="20" y="110" width="1360" height="355" rx="12" fill="#FAFBFC" stroke="#D0D7E2"/>
  <text x="40" y="137" class="sec">① INGESTION: offline, run once per PDF</text>

  <!-- Row 1 -->
  <rect x="40" y="155" width="230" height="135" rx="10" class="sto"/>
  <text x="155" y="182" text-anchor="middle" class="t">Source PDFs</text>
  <text x="155" y="206" text-anchor="middle" class="b">5 GenAI handbooks</text>
  <text x="155" y="226" text-anchor="middle" class="b">text · images · vector diagrams</text>
  <text x="155" y="246" text-anchor="middle" class="b">tables · scanned pages</text>

  <rect x="310" y="155" width="230" height="135" rx="10" class="cpu"/>
  <text x="425" y="178" text-anchor="middle" class="t">1. Parse (PyMuPDF)</text>
  <text x="425" y="197" text-anchor="middle" class="b">text blocks + heading path</text>
  <text x="425" y="214" text-anchor="middle" class="b">embedded images (native res)</text>
  <text x="425" y="231" text-anchor="middle" class="b">tables first → rows / columns</text>
  <text x="425" y="248" text-anchor="middle" class="b">diagrams: drop table grids, rules,</text>
  <text x="425" y="265" text-anchor="middle" class="b">isolated shapes → PNG ≥ 200 DPI</text>
  <text x="425" y="282" text-anchor="middle" class="b">textless pages → page PNG</text>

  <rect x="580" y="155" width="230" height="135" rx="10" class="sto"/>
  <text x="695" y="182" text-anchor="middle" class="t">Element store</text>
  <text x="695" y="206" text-anchor="middle" class="b">elements.jsonl · tables.jsonl</text>
  <text x="695" y="226" text-anchor="middle" class="b">assets/*.png</text>
  <text x="695" y="250" text-anchor="middle" class="s">every item: file · page · bbox · id</text>
  <text x="695" y="268" text-anchor="middle" class="s">skips logged with a reason</text>

  <rect x="850" y="155" width="230" height="135" rx="10" class="cpu"/>
  <text x="965" y="182" text-anchor="middle" class="t">2. Export caption bundle</text>
  <text x="965" y="206" text-anchor="middle" class="b">figure PNGs</text>
  <text x="965" y="226" text-anchor="middle" class="b">+ page heading + nearby text</text>
  <text x="965" y="246" text-anchor="middle" class="b">+ “Figure N” references</text>
  <text x="965" y="266" text-anchor="middle" class="b">→ jobs.jsonl</text>

  <rect x="1120" y="155" width="230" height="135" rx="10" class="gpu"/>
  <text x="1235" y="178" text-anchor="middle" class="t">3. VLM captioning</text>
  <text x="1235" y="199" text-anchor="middle" class="b">Qwen2.5-VL (7B AWQ on vLLM;</text>
  <text x="1235" y="217" text-anchor="middle" class="b">fallback: 4-bit HF or 3B) · T4 GPU</text>
  <text x="1235" y="235" text-anchor="middle" class="b">image size capped (max_pixels)</text>
  <text x="1235" y="253" text-anchor="middle" class="b">type-aware prompt → JSON caption</text>
  <text x="1235" y="271" text-anchor="middle" class="b">+ labels + chart values (exact/est.)</text>

  <line x1="270" y1="222" x2="308" y2="222" class="ln" marker-end="url(#arr)"/>
  <line x1="540" y1="222" x2="578" y2="222" class="ln" marker-end="url(#arr)"/>
  <line x1="810" y1="222" x2="848" y2="222" class="ln" marker-end="url(#arr)"/>
  <line x1="1080" y1="222" x2="1118" y2="222" class="ln" marker-end="url(#arr)"/>
  <line x1="1235" y1="290" x2="1235" y2="323" class="ln" marker-end="url(#arr)"/>
  <text x="1245" y="311" class="lbl">captions.jsonl</text>

  <!-- Row 2 (right to left) -->
  <rect x="1120" y="325" width="230" height="120" rx="10" class="cpu"/>
  <text x="1235" y="350" text-anchor="middle" class="t">4. Import &amp; enrich</text>
  <text x="1235" y="369" text-anchor="middle" class="b">validate caption schema</text>
  <text x="1235" y="386" text-anchor="middle" class="b">cross-check labels vs PDF text</text>
  <text x="1235" y="403" text-anchor="middle" class="b">link figs: “Fig N” → “below” → nearby</text>
  <text x="1235" y="420" text-anchor="middle" class="b">table summaries (OpenAI, cached)</text>
  <text x="1235" y="437" text-anchor="middle" class="b">low confidence → needs_review</text>

  <rect x="850" y="325" width="230" height="120" rx="10" class="cpu"/>
  <text x="965" y="350" text-anchor="middle" class="t">5. Chunk</text>
  <text x="965" y="372" text-anchor="middle" class="b">text: section-aware, 400–800 tok</text>
  <text x="965" y="390" text-anchor="middle" class="b">figure doc = caption + context</text>
  <text x="965" y="408" text-anchor="middle" class="b">table: summary → vector, cells → keyword</text>

  <rect x="580" y="325" width="230" height="120" rx="10" class="api"/>
  <text x="695" y="350" text-anchor="middle" class="t">6. Embed</text>
  <text x="695" y="372" text-anchor="middle" class="b">OpenAI embeddings</text>
  <text x="695" y="390" text-anchor="middle" class="b">1,536 dims (or local bge-m3)</text>
  <text x="695" y="412" text-anchor="middle" class="s">cached by content hash</text>

  <rect x="310" y="325" width="230" height="120" rx="10" class="sto"/>
  <text x="425" y="348" text-anchor="middle" class="t">PostgreSQL (one database)</text>
  <text x="425" y="369" text-anchor="middle" class="b">pgvector HNSW → semantic</text>
  <text x="425" y="386" text-anchor="middle" class="b">full-text (english + simple) → keyword</text>
  <text x="425" y="403" text-anchor="middle" class="b">metadata · captions · tables · bbox</text>
  <text x="425" y="421" text-anchor="middle" class="s">one transaction per PDF</text>
  <text x="425" y="438" text-anchor="middle" class="s">PNGs on disk, paths in DB</text>

  <rect x="40" y="340" width="230" height="90" rx="10" fill="#FFFFFF" stroke="#9AA3AF" stroke-dasharray="5 4"/>
  <text x="155" y="368" text-anchor="middle" class="lbl">Incremental by design</text>
  <text x="155" y="390" text-anchor="middle" class="s">unchanged content = zero</text>
  <text x="155" y="408" text-anchor="middle" class="s">GPU / API calls on re-run</text>
  <text x="155" y="424" text-anchor="middle" class="s">every run traced (OpenTelemetry)</text>

  <line x1="1120" y1="385" x2="1082" y2="385" class="ln" marker-end="url(#arr)"/>
  <line x1="850" y1="385" x2="812" y2="385" class="ln" marker-end="url(#arr)"/>
  <line x1="580" y1="385" x2="542" y2="385" class="ln" marker-end="url(#arr)"/>

  <!-- ================= SECTION 2: QUERY ================= -->
  <rect x="20" y="485" width="1360" height="575" rx="12" fill="#FAFBFC" stroke="#D0D7E2"/>
  <text x="40" y="512" class="sec">② QUERY: online, every question (no GPU)</text>

  <!-- User + UI -->
  <rect x="40" y="535" width="200" height="52" rx="10" class="usr"/>
  <text x="140" y="556" text-anchor="middle" class="t">User</text>
  <text x="140" y="576" text-anchor="middle" class="s">opens the app</text>

  <rect x="40" y="691" width="200" height="72" rx="10" class="cpu"/>
  <text x="140" y="714" text-anchor="middle" class="t">Chat UI (Streamlit)</text>
  <text x="140" y="734" text-anchor="middle" class="b">sends question, renders</text>
  <text x="140" y="751" text-anchor="middle" class="b">answer blocks (③)</text>

  <line x1="140" y1="587" x2="140" y2="601" class="ln" marker-end="url(#arr)"/>
  <rect x="40" y="603" width="200" height="72" rx="10" class="cpu"/>
  <text x="140" y="624" text-anchor="middle" class="t">Sign in (email + password)</text>
  <text x="140" y="644" text-anchor="middle" class="b">Argon2id · session · lockout</text>
  <text x="140" y="662" text-anchor="middle" class="b">per-user daily limits</text>
  <line x1="140" y1="675" x2="140" y2="689" class="ln" marker-end="url(#arr)"/>
  <line x1="240" y1="727" x2="288" y2="727" class="ln"/>
  <line x1="288" y1="727" x2="288" y2="597" class="ln"/>
  <line x1="288" y1="597" x2="338" y2="597" class="ln" marker-end="url(#arr)"/>

  <!-- Agent container -->
  <rect x="300" y="530" width="590" height="400" rx="12" fill="#F3FAF5" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="315" y="553" class="lbl" fill="#2E8B57">AGENT · LangGraph state graph · OpenAI LLM with tool calling in each node</text>

  <rect x="340" y="570" width="500" height="55" rx="9" class="api"/>
  <text x="590" y="592" text-anchor="middle" class="t">Recall user memory → Plan</text>
  <text x="590" y="612" text-anchor="middle" class="b">classify (conceptual · visual · quantitative · multi-part), pick tools + round limit</text>

  <rect x="340" y="660" width="500" height="55" rx="9" class="api"/>
  <text x="590" y="682" text-anchor="middle" class="t">Retrieve</text>
  <text x="590" y="702" text-anchor="middle" class="b">parallel tool calls in one turn (text + figures + tables)</text>

  <polygon points="470,776 590,738 710,776 590,814" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="590" y="781" text-anchor="middle" class="t">Enough evidence?</text>

  <rect x="340" y="845" width="500" height="60" rx="9" class="api"/>
  <text x="590" y="868" text-anchor="middle" class="t">Compose structured answer</text>
  <text x="590" y="889" text-anchor="middle" class="b">text · image · chart · table · sources, every block cited</text>

  <line x1="590" y1="625" x2="590" y2="658" class="ln" marker-end="url(#arr)"/>
  <line x1="590" y1="715" x2="590" y2="736" class="ln" marker-end="url(#arr)"/>
  <line x1="590" y1="814" x2="590" y2="843" class="ln" marker-end="url(#arr)"/>
  <text x="600" y="835" class="lbl">yes</text>

  <!-- no-loop -->
  <line x1="470" y1="776" x2="320" y2="776" class="ln"/>
  <line x1="320" y1="776" x2="320" y2="687" class="ln"/>
  <line x1="320" y1="687" x2="338" y2="687" class="ln" marker-end="url(#arr)"/>
  <text x="335" y="768" class="lbl">no → refine query</text>
  <text x="335" y="800" class="s">3 rounds (up to 5 if multi-part)</text>

  <!-- Tools -->
  <rect x="940" y="530" width="420" height="265" rx="10" class="cpu"/>
  <text x="1150" y="556" text-anchor="middle" class="t">Tools (run locally)</text>
  <text x="1150" y="582" text-anchor="middle" class="b">search_text · search_figures · search_tables</text>
  <text x="1150" y="604" text-anchor="middle" class="b">hybrid SQL: pgvector + full-text → RRF → rerank</text>
  <text x="1150" y="630" text-anchor="middle" class="b">get_figure · get_table</text>
  <text x="1150" y="652" text-anchor="middle" class="b">view_page (rendered page image for the LLM)</text>
  <text x="1150" y="674" text-anchor="middle" class="b">compute (safe arithmetic on source numbers)</text>
  <text x="1150" y="700" text-anchor="middle" class="t">make_chart → chart engine (Plotly)</text>
  <text x="1150" y="722" text-anchor="middle" class="b">bar · pie · line + data table</text>
  <text x="1150" y="744" text-anchor="middle" class="s">rejects values not found in sources</text>
  <text x="1150" y="764" text-anchor="middle" class="s">pie only for parts of a whole, else bar</text>

  <line x1="842" y1="687" x2="938" y2="687" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="896" y="679" class="lbl">calls</text>
  <text x="896" y="705" class="lbl">results</text>

  <rect x="940" y="835" width="420" height="80" rx="10" class="sto"/>
  <text x="1150" y="862" text-anchor="middle" class="t">PostgreSQL + figure PNGs</text>
  <text x="1150" y="885" text-anchor="middle" class="s">built in ①: vectors · full-text · metadata · bbox</text>
  <text x="1150" y="905" text-anchor="middle" class="s">+ conversation threads · user memory (never evidence)</text>
  <line x1="1150" y1="797" x2="1150" y2="833" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Observability -->
  <rect x="975" y="935" width="385" height="105" rx="10" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.4"/>
  <text x="1167" y="959" text-anchor="middle" class="t">Observability (OpenTelemetry)</text>
  <text x="1167" y="980" text-anchor="middle" class="b">one trace per question: plan · rounds · tools ·</text>
  <text x="1167" y="997" text-anchor="middle" class="b">LLM calls · SQL · validator (+ each ingestion run)</text>
  <text x="1167" y="1016" text-anchor="middle" class="b">JSON logs + metrics with trace_id → Phoenix</text>
  <text x="1167" y="1032" text-anchor="middle" class="s">trace_id saved in query_log for every answer</text>

  <!-- Validator -->
  <rect x="340" y="960" width="500" height="80" rx="9" class="cpu"/>
  <text x="590" y="983" text-anchor="middle" class="t">Answer validator (constitution checks)</text>
  <text x="590" y="1004" text-anchor="middle" class="b">citations point to real elements · hydrates file · page · bbox</text>
  <text x="590" y="1024" text-anchor="middle" class="b">images are PDF originals · chart numbers in sources · no memory cited</text>

  <line x1="590" y1="905" x2="590" y2="958" class="ln" marker-end="url(#arr)"/>
  <!-- fail loop -->
  <line x1="840" y1="1000" x2="915" y2="1000" class="ln"/>
  <line x1="915" y1="1000" x2="915" y2="875" class="ln"/>
  <line x1="915" y1="875" x2="842" y2="875" class="ln" marker-end="url(#arr)"/>
  <text x="850" y="1020" class="lbl">fail → repair once</text>

  <!-- pass -->
  <line x1="590" y1="1040" x2="590" y2="1078" class="ln" marker-end="url(#arr)"/>
  <text x="600" y="1062" class="lbl">pass</text>

  <!-- ================= SECTION 3: ANSWER ================= -->
  <rect x="20" y="1080" width="1360" height="215" rx="12" fill="#FBF8FE" stroke="#D9CCEA"/>
  <text x="40" y="1104" class="sec" fill="#5B3A8C">③ MULTIMODAL ANSWER: rendered in the chat UI</text>

  <rect x="40" y="1125" width="300" height="150" rx="10" class="out"/>
  <text x="190" y="1155" text-anchor="middle" class="t">Text</text>
  <text x="190" y="1181" text-anchor="middle" class="b">grounded explanation</text>
  <text x="190" y="1201" text-anchor="middle" class="b">inline citations (file · page)</text>
  <text x="190" y="1229" text-anchor="middle" class="s">“not found in the documents”</text>
  <text x="190" y="1247" text-anchor="middle" class="s">when evidence is missing</text>

  <rect x="380" y="1125" width="300" height="150" rx="10" class="out"/>
  <text x="530" y="1155" text-anchor="middle" class="t">Original figure</text>
  <text x="530" y="1181" text-anchor="middle" class="b">PNG straight from the PDF</text>
  <text x="530" y="1201" text-anchor="middle" class="b">short caption + source page</text>
  <text x="530" y="1229" text-anchor="middle" class="s">never regenerated or redrawn</text>

  <rect x="720" y="1125" width="300" height="150" rx="10" class="out"/>
  <text x="870" y="1155" text-anchor="middle" class="t">Chart + data table</text>
  <text x="870" y="1181" text-anchor="middle" class="b">bar · pie · line (interactive)</text>
  <text x="870" y="1201" text-anchor="middle" class="b">underlying values shown in a table</text>
  <text x="870" y="1229" text-anchor="middle" class="s">exact vs approximate flagged</text>

  <rect x="1060" y="1125" width="300" height="150" rx="10" class="out"/>
  <text x="1210" y="1155" text-anchor="middle" class="t">Sources</text>
  <text x="1210" y="1181" text-anchor="middle" class="b">file · page · element id · bbox</text>
  <text x="1210" y="1201" text-anchor="middle" class="b">click → page view, bbox highlighted</text>
  <text x="1210" y="1229" text-anchor="middle" class="s">bbox from validator, never the LLM</text>
  <!-- ================= SECTION 4: EVALUATION ================= -->
  <rect x="20" y="1310" width="1360" height="145" rx="12" fill="#FAFBFC" stroke="#D0D7E2"/>
  <text x="40" y="1335" class="sec">④ EVALUATION: offline, before any change is kept (RAGAS + custom checks)</text>
  <rect x="40" y="1352" width="240" height="88" rx="10" class="sto"/>
  <text x="160.0" y="1377" text-anchor="middle" class="t">Golden set (40 questions)</text>
  <text x="160.0" y="1399" text-anchor="middle" class="b">reference answers · expected</text>
  <text x="160.0" y="1417" text-anchor="middle" class="b">figures · chart values · tools</text>
  <rect x="310" y="1352" width="250" height="88" rx="10" class="cpu"/>
  <text x="435.0" y="1377" text-anchor="middle" class="t">eval run</text>
  <text x="435.0" y="1399" text-anchor="middle" class="b">agent answers every question</text>
  <text x="435.0" y="1417" text-anchor="middle" class="b">(production config, traced)</text>
  <rect x="590" y="1352" width="300" height="88" rx="10" class="api"/>
  <text x="740.0" y="1377" text-anchor="middle" class="t">RAGAS (judge LLM)</text>
  <text x="740.0" y="1399" text-anchor="middle" class="b">faithfulness · relevancy · context</text>
  <text x="740.0" y="1417" text-anchor="middle" class="b">precision/recall · tool call accuracy</text>
  <rect x="920" y="1352" width="220" height="88" rx="10" class="cpu"/>
  <text x="1030.0" y="1377" text-anchor="middle" class="t">Custom checks</text>
  <text x="1030.0" y="1399" text-anchor="middle" class="b">chart numbers 100% · figure hit</text>
  <text x="1030.0" y="1417" text-anchor="middle" class="b">citations · honest refusals</text>
  <rect x="1170" y="1352" width="190" height="88" rx="10" class="sto"/>
  <text x="1265.0" y="1377" text-anchor="middle" class="t">Compare to baseline</text>
  <text x="1265.0" y="1399" text-anchor="middle" class="b">score drop → run fails</text>
  <text x="1265.0" y="1417" text-anchor="middle" class="b">report + trace links</text>
  <line x1="280" y1="1396" x2="308" y2="1396" class="ln" marker-end="url(#arr)"/>
  <line x1="560" y1="1396" x2="588" y2="1396" class="ln" marker-end="url(#arr)"/>
  <line x1="890" y1="1396" x2="918" y2="1396" class="ln" marker-end="url(#arr)"/>
  <line x1="1140" y1="1396" x2="1168" y2="1396" class="ln" marker-end="url(#arr)"/>
</svg>
