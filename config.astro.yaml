# Astrology library (data/pdfs/Astro_book): its own database, embedded with EmbeddingGemma 2.
# Everything else comes from config.gemma.yaml and config.yaml.
# Use it by setting MMRAG_CONFIG=config.astro.yaml.

extends: config.gemma.yaml

database_name: mmrag_astro

paths:
  pdf_dir: data/pdfs/Astro_book

observability:
  enabled: false   # long unattended ingestion: no trace viewer to export to

parse:
  # Hindi scans whose text layer is a watermark ("Free by Astrostudents") or a legacy-font encoding
  # that extracts as gibberish: every page goes to `mmrag transcribe` instead.
  scanned_for:
    - lal-kitab-1941.pdf
    - lal-kitab-vol-1-1952.pdf
    - lal-kitab-vol-2-1952.pdf
    - lal-kitab-vol-3-1952.pdf
