# Unit and integration tests on every push and pull request (plan Phase 8 task 7).
# No OpenAI key and no cost: `live` tests (real API calls) stay manual, and the regression
# tests skip because the source PDFs are not in git.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16          # same as docker-compose.yml
        env:
          POSTGRES_USER: mmrag
          POSTGRES_PASSWORD: mmrag-ci-only
          POSTGRES_DB: mmrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mmrag"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://mmrag:mmrag-ci-only@localhost:5432/mmrag
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: PostgreSQL 16 client tools (backup and restore tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Tests
        run: python -m pytest -q -rfs
