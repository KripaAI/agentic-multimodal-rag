# All tunable settings (docs/05-low-level-design.md Â§2). Secrets live in .env only.

paths:
  pdf_dir: data/pdfs      # source PDFs (D6)
  data_dir: "data"

parse:
  render_dpi: 200
  min_image_px: 50
  textless_chars: 50
  furniture_width_ratio: 0.85
  line_aspect_ratio: 40
  cluster_merge_distance_pt: 12     # tuned in Phase 1
  min_cluster_shapes: 3             # tuned in Phase 1
  callout_text_coverage: 0.3        # a box this full of text (code, text card) is not a figure...
  callout_min_chars: 100            # ...when it holds at least this many characters
  min_figure_pt: 72                 # figures smaller than 1 inch each way are icons
  min_figure_short_pt: 40           # figures thinner than this are highlight strips (smallest real: 61)
  figure_margin_pt: 6               # padding around a rendered figure
  label_attach_pt: 32               # small-font text / text cards this close to a figure belong to it
  side_note_gap_pt: 72              # small-font notes level with a figure, up to 1 inch to its side
  caption_gap_pt: 40                # max gap between a figure and its caption line
  heading_size_margin_pt: 1.5       # heading = font this much above body size...
  heading_max_chars: 120            # ...or bold and at most this long
  furniture_page_ratio: 0.5         # header/footer = same text + position on > this share of pages...
  furniture_margin_ratio: 0.1       # ...inside the top or bottom 10% of the page
  table_strategy: lines_strict      # PyMuPDF table finder; lines_strict catches tables without vertical rules
  vector_heavy_drawings: 20         # profiler: pages with at least this many drawings

caption:
  model_path: awq-7b                # chosen by the owner in the Phase 2 pilot (options: awq-7b | nf4-7b | 3b)
  max_pixels: 1003520               # 1280 * 28 * 28
  prompt_version: v2                # gpu_job/caption/prompts/caption_v2.md
  kaggle_username: krishmithlesh0786  # owner of the private bundle dataset and GPU kernel

enrich:
  label_overlap_min: 0.5            # share of the VLM's label words that must be in the PDF (tau)
  proximity_window_pt: 150          # candidate paragraphs for a "related" link: this close vertically
  link_min_score: 0.4               # related link needs cosine + label_weight * label share >= this
  label_weight: 0.2                 # (tuned on the link report)
  # Figures never indexed or shown (kept as skipped elements). Owner decision, Phase 5: this
  # PDF prints unrelated course slides under ~80 of its 91 figure captions.
  skip_figures_for:
    - The_Complete_Guide_to_Post_Training_LLMs_v2_Expert_Edition.pdf

chunk:
  min_tokens: 400
  max_tokens: 800
  overlap: 0.15

embed:
  model: text-embedding-3-large     # D1
  dims: 1536                        # fixed in the DB schema; must be <= 2000
  batch_size: 100

search:
  candidates: 30
  rrf_k: 60
  top_k: 8
  hnsw_ef_search: 64
  rerank: false

agent:
  model: gpt-5.4-mini               # D4: owner's choice after the Phase 4 sample run (gpt-4o-mini made no valid charts)
  effort: null
  summary_model: gpt-5.4-mini       # table summaries; owner's pick from the Phase 3 comparison
  rounds_default: 4                 # Phase 6: 4th round lets a rejected chart be fixed (tested with v3)
  rounds_multi: 5
  prompt_version: v3                # src/mmrag/agent/prompts/*_v3.md; owner adopted v3 (chart rules), Phase 6
  tool_timeout_s: 30                # per tool call
  max_parallel_tools: 6             # tool calls run at once in one round

memory:                              # long-term memory (Phase 9, spec §7.8); never evidence (P13)
  enabled: true                      # master switch; each user can also switch their own off
  model: gpt-5.4-mini                # low-cost extractor for statements and episode summaries
  recall_k: 5                        # memories passed to the planner
  retention_days: 365
  max_statement_chars: 200
  idle_minutes: 60                   # a thread with no new question for this long is summarised

# US$ per 1M tokens, per model, for query_log.cost_usd. Owner fills these in from OpenAI's
# pricing page; a model left out is logged with cost null (tokens are always logged).
# Standard (not batch) prices from developers.openai.com/api/docs/pricing, read 2026-09-29.
pricing:
  gpt-5.4-mini: {input_per_mtok: 0.75, output_per_mtok: 4.50}
  gpt-4o-mini: {input_per_mtok: 0.15, output_per_mtok: 0.60}
  gpt-4.1-mini: {input_per_mtok: 0.40, output_per_mtok: 1.60}   # evaluation judge (read 2026-09-30)
  gpt-4.1: {input_per_mtok: 2.00, output_per_mtok: 8.00}

ui:
  page_dpi: 150

auth:
  min_password_length: 12
  common_passwords_file: data/security/common-passwords.txt
  max_failed_attempts: 5
  lockout_minutes: 15
  ip_max_failed_attempts: 20
  session_idle_hours: 8
  session_absolute_days: 7
  daily_question_limit: 100
  daily_cost_limit_usd: 2.00
  limits_timezone: UTC               # set to your IANA zone, e.g. Europe/London
  trust_proxy_headers: false

observability:
  enabled: true
  environment: dev
  otlp_traces_endpoint: http://localhost:6006/v1/traces   # Phoenix (D12)
  otlp_metrics_endpoint: null        # Phoenix has no metrics store; set when a metrics backend exists
  capture_content: true              # dev only; false in production (D13)
  sample_ratio: 1.0
  log_level: INFO
  log_file: data/logs/app.jsonl

retention:
  query_log_days: 90
  auth_events_days: 365

alerts:                              # mmrag obs alerts (run on a schedule; exit 1 when an alert fires)
  daily_cost_usd: 5.00               # all users together, today
  dropped_rate: 0.3                  # answers with removed (unverified) parts, last hour
  min_questions: 5                   # ...only judged with at least this many questions
  failed_sign_ins_per_hour: 20

eval:
  golden_set: eval/golden_set.jsonl
  judge_model: gpt-4.1-mini          # D14: must differ from agent.model; owner chose -mini (5x cheaper) for budget, Phase 6
  regression_tolerance: 0.03
